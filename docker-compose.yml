services:
  kv-phimai:
    image: vndangkhoa/kv-phimai:latest
    # build: .            # uncomment to build from source instead of pulling
    container_name: kv-phimai
    platform: linux/amd64
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - DATA_DIR=/app/data
      - DATABASE_URL=/app/data/phimai.db
      - TZ=Asia/Ho_Chi_Minh
      # REQUIRED: your video backend (PhimAI does not include one). Pick ONE option:
      #  Option A — KV-Tube (https://github.com/vndangkhoa/kv-tube):
      - KVTUBE_URL=${KVTUBE_URL:-}
      #  Option B — plain Invidious + Invidious Companion:
      # - INVIDIOUS_UPSTREAM=https://invidious.example.com
      # - COMPANION_URL=https://invidious.example.com   # host that serves /companion/...
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
